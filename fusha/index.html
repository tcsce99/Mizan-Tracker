<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0d1117"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fuṣḥā"/>
<meta name="description" content="Learn to read and speak Classical (Fuṣḥā / Qur'anic) Arabic, and to read any text without diacritics."/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Fuṣḥā — Classical Arabic</title>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2230;--bg4:#2a3344;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,0.14);--gold-glow:rgba(201,168,76,0.3);--gold-hi:#e8c96a;
  --green:#3fb950;--green-dim:rgba(63,185,80,0.14);
  --red:#f85149;--blue:#58a6ff;--orange:#f0883e;
  --text:#e6edf3;--text2:#9aa4af;--text3:#6b7480;
  --r:14px;--r-sm:9px;
  --ar:'Amiri','Scheherazade New','Noto Naskh Arabic','Traditional Arabic','Geeza Pro','Times New Roman',serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
select,input{font-family:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}

#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-char{font-size:26px;color:var(--gold);line-height:1;font-family:var(--ar)}
.brand-name{font-size:17px;font-weight:750}
.brand-sub{font-size:9.5px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;font-weight:600}
.tb-right{display:flex;gap:6px;align-items:center}
.chip{font-size:11.5px;font-weight:600;color:var(--text2);background:var(--bg2);border:1px solid var(--border);padding:4px 9px;border-radius:20px;white-space:nowrap}

.main{flex:1;padding:16px}
.view{display:flex;flex-direction:column;gap:14px}
.sec-h{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 0}
.hint{font-size:13px;color:var(--text2);line-height:1.5;margin:-4px 2px 2px}
.hint b{color:var(--text)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.ar{font-family:var(--ar);direction:rtl}
.big{font-size:1.5em}
.centered{text-align:center}

.hero{background:linear-gradient(150deg,var(--bg2),var(--bg3))}
.hero-h{font-size:24px;font-family:var(--ar);direction:rtl;text-align:left}
.hero-sub{font-size:13.5px;color:var(--text2);margin-top:3px}
.goal-wrap{display:flex;align-items:center;gap:18px;margin-top:16px}
.goal-ring{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.goal-inner{width:74px;height:74px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.goal-inner b{font-size:22px;color:var(--gold);line-height:1}
.goal-inner span{font-size:10px;color:var(--text3)}
.goal-txt{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--text2)}
.goal-txt b{color:var(--text);font-size:15px}

.action{display:flex;flex-direction:column;gap:4px}
.ac-lbl{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.6px}
.ac-title{font-size:17px;font-weight:700}
.ac-ar{font-family:var(--ar);direction:rtl;text-align:left;color:var(--text2);font-size:17px}
.ac-sub{font-size:13px;color:var(--text2)}
.ac-sub b{color:var(--gold)}
.action .btn{margin-top:10px;align-self:flex-start}

.btn{padding:11px 18px;border-radius:var(--r-sm);font-size:14.5px;font-weight:650;border:1px solid transparent}
.btn:active{transform:scale(.98)}
.btn.wide{width:100%}
.btn.primary{background:var(--gold);color:#1a1400}
.btn.gold{background:var(--gold-dim);color:var(--gold);border-color:var(--gold)}
.btn.ghost{background:var(--bg3);color:var(--text2);border-color:var(--border)}
.btn.danger{background:rgba(248,81,73,.15);color:var(--red);border-color:var(--red)}
.btn.mini{padding:7px 12px;font-size:12.5px;border-radius:7px;background:var(--gold);color:#1a1400;white-space:nowrap}
.btn.mini.ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.track-mini{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--tc);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;text-align:left;min-width:0}
.tm-ic{font-size:22px;font-family:var(--ar);color:var(--tc);line-height:1.2}
.tm-nm{font-size:12.5px;font-weight:650;line-height:1.3}
.tm-bar{width:100%;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.tm-bar span{display:block;height:100%;background:var(--tc);border-radius:3px}
.tm-pct{font-size:11px;color:var(--text3);font-weight:600}

.track-head{display:flex;align-items:center;gap:12px;padding:12px 4px 10px;border-bottom:1px solid var(--border);margin-bottom:8px}
.th-ic{font-size:28px;font-family:var(--ar);width:34px;text-align:center;flex-shrink:0}
.th-txt{flex:1;min-width:0}
.th-nm{font-size:15.5px;font-weight:700}
.th-ar{font-family:var(--ar);color:var(--text2);font-size:15px;font-weight:400}
.th-desc{font-size:12px;color:var(--text2);line-height:1.4}
.th-pct{font-size:15px;font-weight:750;color:var(--gold)}
.lesson-list{display:flex;flex-direction:column;gap:7px}
.lesson-row{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px}
.lesson-row.done .lr-dot{color:var(--green)}
.lesson-row.locked .lr-title{color:var(--text2)}
.lr-dot{font-size:15px;color:var(--text3);width:20px;text-align:center;flex-shrink:0}
.lr-txt{flex:1;min-width:0}
.lr-title{font-size:14px;font-weight:600;line-height:1.3}
.lr-ar{font-size:11.5px;color:var(--text3);margin-top:1px}
.lr-acts{display:flex;flex-direction:column;gap:5px;align-items:stretch;flex-shrink:0}

.modal-back{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;border:1px solid var(--border2);border-bottom:none;position:relative;padding:22px 18px calc(28px + env(safe-area-inset-bottom))}
@media(min-width:641px){.modal-back{align-items:center}.modal{border-radius:20px;border-bottom:1px solid var(--border2);max-height:88vh}}
.modal-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--bg3);color:var(--text2);font-size:14px;z-index:2}

.lesson-view{display:flex;flex-direction:column;gap:12px}
.lv-eyebrow{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
.lv-title{font-size:21px;font-weight:750;line-height:1.25;padding-right:34px}
.lv-ar{font-family:var(--ar);color:var(--text2);font-weight:400;font-size:19px}
.lv-content{font-size:14.5px;line-height:1.7}
.lv-content p{margin:10px 0}
.lv-content b{color:var(--gold-hi);font-weight:650}
.lv-content i{color:var(--text2)}
.lv-content .ar{font-size:1.2em}
.lv-content p.ar.big{font-size:1.65em;line-height:1.9}
.lv-content ul,.lv-content ol{margin:10px 0;padding-left:22px}
.lv-content li{margin:5px 0}
.lv-content table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;display:block;overflow-x:auto}
.lv-content th{background:var(--bg3);color:var(--text2);font-weight:600;text-align:left;padding:8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.lv-content td{border-top:1px solid var(--border);padding:8px 10px;vertical-align:top}
.lv-content td.ar{font-size:19px;text-align:right;white-space:nowrap}
.lv-content td.ar.big{font-size:26px}
.lv-sec{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-top:8px}
.ex-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:var(--r-sm);padding:12px 14px}
.ex-ar{font-family:var(--ar);direction:rtl;font-size:22px;line-height:1.9}
.ex-en{font-size:13px;color:var(--text2);margin-top:5px;line-height:1.5}
.ex-src{font-size:11.5px;color:var(--gold);margin-top:5px;font-style:italic}

.quiz-view{display:flex;flex-direction:column;gap:14px}
.qz-top{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:650;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding-right:38px}
.qz-prog{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.qz-prog span{display:block;height:100%;background:var(--gold);border-radius:3px}
.qz-q{font-size:18px;font-weight:650;line-height:1.6;font-family:system-ui,var(--ar)}
.qz-opts{display:flex;flex-direction:column;gap:9px}
.qz-opt{text-align:left;padding:13px 15px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:16.5px;font-family:system-ui,var(--ar);line-height:1.5}
.qz-opt.right{border-color:var(--green);background:var(--green-dim);color:var(--green)}
.qz-opt.wrong{border-color:var(--red);background:rgba(248,81,73,.12);color:var(--red)}
.qz-ex{font-size:13.5px;line-height:1.55;padding:11px 13px;border-radius:var(--r-sm);font-family:system-ui,var(--ar)}
.qz-ex.ok{background:var(--green-dim);color:var(--green)}
.qz-ex.no{background:rgba(248,81,73,.1);color:#ff9d97}
.wk-clock{font-variant-numeric:tabular-nums;color:var(--gold)}
.wk-from{font-size:11.5px;color:var(--text3);font-weight:650;text-transform:uppercase;letter-spacing:.4px}

.quiz-result,.skip-intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;padding:12px 4px}
.qr-emoji,.si-ic{font-size:42px}
.qr-score{font-size:38px;font-weight:800;color:var(--gold)}
.qr-sub{font-size:13px;color:var(--text2)}
.qr-msg,.si-p{font-size:14px;line-height:1.6;margin:6px 0;max-width:94%;color:var(--text2)}
.qr-msg b,.si-p b{color:var(--gold-hi)}
.si-h{font-size:20px;font-weight:750}
.skip-intro .btn{width:100%}

.sr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.sr-stats>div{display:flex;flex-direction:column;gap:2px}
.sr-stats b{font-size:22px;color:var(--gold);font-weight:750}
.sr-stats span{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.empty{text-align:center;color:var(--text2);font-size:14px;line-height:1.6;padding:26px 16px;background:var(--bg2);border:1px dashed var(--border2);border-radius:var(--r)}
.sr-card{width:100%;min-height:190px;background:linear-gradient(160deg,var(--bg2),var(--bg3));border:1px solid var(--border2);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px 18px;cursor:pointer}
.sr-front{font-family:var(--ar);direction:rtl;font-size:44px;line-height:1.5;color:var(--gold-hi);text-align:center}
.sr-front.small{font-size:30px;color:var(--text)}
.sr-back{font-size:19px;text-align:center;line-height:1.4;font-family:system-ui,var(--ar)}
.sr-tap{font-size:12px;color:var(--text3);text-align:center}
.sr-grades{display:flex;gap:7px;width:100%}
.sr-grade{flex:1;padding:13px 4px;font-size:13px}
.g-again{background:rgba(248,81,73,.14);color:var(--red);border-color:var(--red)}
.g-hard{background:rgba(240,136,62,.14);color:var(--orange);border-color:var(--orange)}
.g-good{background:var(--green-dim);color:var(--green);border-color:var(--green)}
.g-easy{background:var(--gold-dim);color:var(--gold);border-color:var(--gold)}

.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-chip{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--bg2);border:1px solid var(--border);color:var(--text2)}
.filter-chip.on{background:var(--gold-dim);color:var(--gold);border-color:var(--gold)}
.text-list{display:flex;flex-direction:column;gap:9px}
.text-card{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 14px;text-align:left}
.tc-lvl{font-size:11px;font-weight:750;padding:4px 8px;border-radius:6px;flex-shrink:0}
.lvl1{background:var(--green-dim);color:var(--green)}
.lvl2{background:rgba(88,166,255,.14);color:var(--blue)}
.lvl3{background:var(--gold-dim);color:var(--gold)}
.lvl4{background:rgba(240,136,62,.14);color:var(--orange)}
.lvl5{background:rgba(248,81,73,.14);color:var(--red)}
.tc-main{flex:1;min-width:0}
.tc-title{font-size:14.5px;font-weight:650}
.tc-ar{font-family:var(--ar);font-size:16px;color:var(--text2)}
.tc-src{font-size:11.5px;color:var(--text3)}
.tc-go{color:var(--text3);font-size:18px}

.reader-view,.tutor-view{display:flex;flex-direction:column;gap:13px}
.rv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-right:38px}
.rv-title{font-size:19px;font-weight:750}
.rv-src{font-size:12px;color:var(--gold)}
.tashkil-tog{font-size:12.5px;font-weight:650;padding:8px 12px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);flex-shrink:0;white-space:nowrap}
.tashkil-tog.on{background:var(--gold-dim);color:var(--gold);border-color:var(--gold)}
.rv-text{font-family:var(--ar);direction:rtl;font-size:29px;line-height:2.3;text-align:right;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.rv-word{cursor:pointer;padding:0 2px;border-radius:5px}
.rv-word.sel{background:var(--gold);color:#1a1400}
.rv-word.heard{color:var(--green)}
.rv-word.missed{color:var(--red);text-decoration:underline dotted}
.rv-word.sel.heard,.rv-word.sel.missed{color:#1a1400}
.verse-mark{color:var(--gold);font-size:.62em}
.gloss-pop{min-height:46px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px;font-size:14px;color:var(--text2);text-align:center}
.gloss-pop.show{background:var(--gold-dim);border-color:var(--gold);color:var(--text)}
.gloss-pop b{font-family:var(--ar);font-size:1.4em;color:var(--gold-hi);font-weight:400}
.heard-raw{font-family:var(--ar);direction:rtl;font-size:17px;color:var(--text2);margin-top:6px}
.rv-tip{font-size:12.5px;color:var(--text2);line-height:1.55}

.speak-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.sp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%}
.sp-title{font-size:15px;font-weight:700}
.sp-ar{font-family:var(--ar);font-size:17px;color:var(--gold)}
.sp-prompt{font-size:14px;line-height:1.6;font-family:system-ui,var(--ar)}
.sp-lock{font-size:12px;color:var(--text3);font-style:italic}
.sp-model{background:var(--bg3);border-radius:var(--r-sm);padding:2px 13px;width:100%}
.sp-model summary{padding:10px 0;font-size:13px;font-weight:650;color:var(--gold);cursor:pointer}
.sp-model-ar{font-family:var(--ar);direction:rtl;font-size:21px;line-height:2;padding-bottom:12px}

.tutor-setup{background:var(--bg2);border:1px solid var(--gold);border-radius:var(--r-sm);padding:13px}
.ts-p{font-size:12.5px;color:var(--text2);line-height:1.55;margin-bottom:10px}
.ts-p b{color:var(--gold-hi)}
.ts-in,.tutor-in{width:100%;min-width:0;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:11px 12px;font-size:16px;color:var(--text)}
.ts-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.ts-row .set-sel{flex:1;min-width:0}
.tutor-log{display:flex;flex-direction:column;gap:9px;min-height:170px}
.tb{max-width:90%;padding:11px 13px;border-radius:14px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.tb.me{align-self:flex-end;background:var(--gold-dim);border:1px solid var(--gold);font-family:var(--ar);font-size:21px;direction:rtl}
.tb.tutor{align-self:flex-start;background:var(--bg2);border:1px solid var(--border)}
.tb.wait{color:var(--text3)}
.tt-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2)}
.tt-ar{font-family:var(--ar);direction:rtl;font-size:23px;line-height:1.9}
.tt-ar.ok{color:var(--green)}
.tt-ar.fix{color:var(--gold-hi)}
.tt-ar.reply{border-top:1px solid var(--border);margin-top:8px;padding-top:6px}
.tt-note{font-size:13px;color:var(--text2);margin-top:3px}
.tt-en{font-size:12.5px;color:var(--text3);font-style:italic}
.tutor-status{font-size:12.5px;color:var(--text2);min-height:19px}
.tutor-bar{display:flex;gap:8px;align-items:center;position:sticky;bottom:-28px;background:var(--bg);padding:8px 0 12px}
.tutor-mic{width:46px;height:46px;border-radius:50%;background:var(--gold);font-size:20px;flex-shrink:0}
.tutor-mic.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.tutor-in{font-family:system-ui,var(--ar)}

.tl-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tl-rate{display:flex;flex-direction:column;gap:3px}
.tl-rate b{font-size:26px;color:var(--gold);font-weight:800;line-height:1}
.tl-rate span{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.tl-node{display:flex;gap:14px;padding-bottom:20px;position:relative}
.tl-node::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border2)}
.tl-node:last-child::before{display:none}
.tl-node.reached::before{background:var(--green)}
.tl-dot{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:750;color:var(--text2);flex-shrink:0;z-index:1}
.tl-node.reached .tl-dot{background:var(--green);border-color:var(--green);color:#04210a}
.tl-body{flex:1;min-width:0;padding-top:3px}
.tl-title{font-size:15.5px;font-weight:700;line-height:1.3}
.tl-arh{font-family:var(--ar);color:var(--text2);font-weight:400;font-size:15px}
.tl-desc{font-size:12.5px;color:var(--text2);line-height:1.5;margin:3px 0 7px}
.tl-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tl-badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--gold-dim);color:var(--gold)}
.tl-badge.done{background:var(--green-dim);color:var(--green)}
.tl-date{font-size:11.5px;color:var(--text);font-weight:600}
.tl-gap{font-size:11px;color:var(--text3)}
.tl-need{font-size:11.5px;color:var(--orange);margin-top:5px}
.tl-progbar{height:4px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:8px}
.tl-progbar span{display:block;height:100%;background:var(--gold);border-radius:3px}

.rr-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.rr-row:first-child{border-top:none}
.rr-lb{flex:1;font-size:12.5px}
.rr-bar{width:84px;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;flex-shrink:0}
.rr-bar span{display:block;height:100%;background:var(--gold);border-radius:3px}
.rr-pct{font-size:11.5px;color:var(--text2);font-weight:650;width:36px;text-align:right}

.res-list{display:flex;flex-direction:column;gap:8px}
.res-card{display:block;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 14px}
.res-nm{font-size:14px;font-weight:650;color:var(--gold)}
.res-desc{font-size:12.5px;color:var(--text2);line-height:1.5;margin-top:3px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:14px;border-top:1px solid var(--border)}
.set-row:first-child{border-top:none}
.set-sel{background:var(--bg3);border:1px solid var(--border2);border-radius:7px;padding:8px 10px;font-size:13px}
.set-btns{display:flex;gap:7px}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:640px;margin:0 auto;background:rgba(13,17,23,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;position:relative;color:var(--text3)}
.nav-btn.active{color:var(--gold)}
.nav-ic{font-size:19px;font-family:var(--ar);line-height:1.15}
.nav-lb{font-size:9.5px;font-weight:600}
.nav-badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:9px;font-weight:750;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
</style>
</head>
<body>
<div id="app"></div>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="data4.js"></script>
<script src="app.js"></script>
</body>
</html>
